name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: python -m pip install --upgrade pip pillow
      - name: 引擎单元测试（19 个）
        run: python -m unittest discover -s prototype -p "test_engine.py" -v
      - name: 端到端流程回归（14 个，无显示器）
        run: python demo/test_flow.py -v
      - name: 素材与配置一致性（9 个）
        run: python demo/test_assets.py -v
